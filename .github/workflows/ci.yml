name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          target: api
          load: true
          tags: archie-test-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          target: web
          load: true
          tags: archie-test-web:latest
          cache-from: type=gha

      - name: Lint
        run: task lint:eslint

      - name: Type check
        run: task lint:type-check

      - name: Dependency check
        run: task lint:depcruise

      - name: Test API & shared
        run: task test:unit

      - name: Teardown
        if: always()
        run: docker compose down -v
